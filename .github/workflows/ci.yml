name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  issues:
    types:
      - opened
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # PR Title Lint (Conventional Commits subset)
  # ============================================================================
  # Squash-merge uses the PR title as the commit subject and bypasses the
  # local enforce-commit pre-commit commit-msg hook (bot PRs never run local
  # git hooks). Without a server-side check, a bot title like
  # "Sentinel: [HIGH] Fix ..." squash-merges with a non-conventional subject
  # -> PSR's commit parser silently ignores it -> no version bump, even for a
  # security fix. This job only surfaces a red check; it does not block
  # merge (no required-status-check rule), so the person merging still must
  # retype the squash-commit subject to start with fix:/feat: when this is red.
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix: (feedback_commit_prefix.md). This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.

  lint-and-test:
    name: Lint & Test (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff check
        run: uv run --no-sync ruff check .

      - name: Run Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Run ty type check
        run: uv run --no-sync ty check

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # Runs for bot actors too. The "Main Ruleset" requires CodeQL results to
    # merge, and this repo has code-scanning default setup disabled, so this
    # job is the only producer of those results. Excluding dependabot and
    # renovate left every dependency PR permanently blocked and merged only
    # via --admin, which bypasses the whole ruleset rather than just CodeQL.
    # Dependency changes are also the changes most worth scanning.
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push')
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  email-notify:
    name: Email Notification
    if: >-
      (github.event_name == 'issues' || github.event_name == 'pull_request_target')
      && github.actor != 'n24q02m'
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prepare notification data
        id: data
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ACTOR: ${{ github.actor }}
          ACTION: ${{ github.event.action }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            {
              echo "event_type<<ENDOFEVENTTYPE"
              echo "Issue"
              echo "ENDOFEVENTTYPE"
            } >> "$GITHUB_OUTPUT"
            {
              echo "title<<ENDOFTITLE"
              echo "$ISSUE_TITLE"
              echo "ENDOFTITLE"
            } >> "$GITHUB_OUTPUT"
            {
              echo "number<<ENDOFNUMBER"
              echo "$ISSUE_NUMBER"
              echo "ENDOFNUMBER"
            } >> "$GITHUB_OUTPUT"
            {
              echo "url<<ENDOFURL"
              echo "$ISSUE_URL"
              echo "ENDOFURL"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "event_type<<ENDOFEVENTTYPE"
              echo "PR"
              echo "ENDOFEVENTTYPE"
            } >> "$GITHUB_OUTPUT"
            {
              echo "title<<ENDOFTITLE"
              echo "$PR_TITLE"
              echo "ENDOFTITLE"
            } >> "$GITHUB_OUTPUT"
            {
              echo "number<<ENDOFNUMBER"
              echo "$PR_NUMBER"
              echo "ENDOFNUMBER"
            } >> "$GITHUB_OUTPUT"
            {
              echo "url<<ENDOFURL"
              echo "$PR_URL"
              echo "ENDOFURL"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Parse SMTP credential
        run: |
          echo "SMTP_USER=${SMTP_CREDENTIAL%%:*}" >> $GITHUB_ENV
          echo "SMTP_PASS=${SMTP_CREDENTIAL#*:}" >> $GITHUB_ENV
        env:
          SMTP_CREDENTIAL: ${{ secrets.SMTP_CREDENTIAL }}

      - name: Send email notification
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASS }}
          subject: "[${{ github.event.repository.name }}] ${{ steps.data.outputs.event_type }} #${{ steps.data.outputs.number }}: ${{ steps.data.outputs.title }}"
          to: ${{ env.SMTP_USER }}
          from: GitHub Notify <${{ env.SMTP_USER }}>
          body: |
            New ${{ steps.data.outputs.event_type }} in ${{ github.repository }}

            Title: ${{ steps.data.outputs.title }}
            Author: ${{ github.actor }}
            URL: ${{ steps.data.outputs.url }}
            Action: ${{ github.event.action }}

  # Merged from bot-governance.yml (deleted).
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    # Govern only branches pushed to this repository. This repo is public, so it
    # receives pull requests from forks; the private original this workflow was
    # ported from never saw one.
    #
    # Product reason: a fork pull request is an outside contribution. Its branch
    # name is not ours to read as a bot signature, and closing someone's first
    # contribution because our own bots spent the day's rate limit is the wrong
    # outcome.
    #
    # Technical reason: on the pull_request trigger a fork gets a read-only
    # GITHUB_TOKEN, and the permissions block above cannot raise it -- that is a
    # ceiling, not a grant. Of the writing gh calls below, the --add-label ones
    # end in `|| true`, but `gh pr close` and `gh pr comment` do not, so under
    # `set -e` they would fail the job rather than the pull request.
    #
    # Kept at job level rather than as the first statement of the script: an
    # in-script guard is only correct while it stays first, and an ordering
    # assumption is the very bug being fixed here -- a later edit adding a gh
    # call above it would reintroduce this silently. A job condition cannot be
    # stepped over, and it skips without starting a runner.
    #
    # Compares full_name rather than testing head.repo.fork, because `fork`
    # describes the source repository: were this repository itself ever made a
    # fork, head.repo.fork would be true for our own branches too and governance
    # would switch off permanently while the workflow still reported green.
    if: github.event_name == 'pull_request' && github.event.action == 'opened' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Detect if this is a bot-created PR by branch name pattern.
          # Two signals:
          #   1. Explicit bot-tool prefixes (Bolt, Palette, Jules, fix/web-scraper)
          #   2. Any branch ending with a long numeric task/trace ID (-[0-9]{14,})
          IS_BOT_PR=false
          if echo "$BRANCH" | grep -qE \
              '^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])'; then
            IS_BOT_PR=true
          elif echo "$BRANCH" | grep -qE -- \
              '-[0-9]{14,}$'; then
            IS_BOT_PR=true
          fi

          if [ "$IS_BOT_PR" = "false" ]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on branch: $BRANCH"
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO" || true

          # --- Rate limit: max 5 bot PRs/actor/day ---
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                  date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh pr list --repo "$REPO" --state open \
                   --json createdAt,headRefName,author \
                   --jq "[.[] |
                          select(.author.login == \"$ACTOR\") |
                          select(.createdAt > \"$SINCE\") |
                          select(.headRefName | test(
                            \"^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])\" +
                            \"|-[0-9]{14,}$\"
                          ))] | length" 2>/dev/null || echo 0)

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"

          if [ "${COUNT:-0}" -gt 5 ]; then
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # --- Duplicate detection by title keyword ---
          KEYWORD=$(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
                    tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$KEYWORD" ]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          DUPES=$(gh pr list --repo "$REPO" --state open --search "$KEYWORD" \
                   --json number \
                   --jq "[.[] | select(.number != $PR_NUMBER)] | length" \
                   2>/dev/null || echo 0)

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if [ "${DUPES:-0}" -ge 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "possible-duplicate" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('${KEYWORD}'). Check before merging: \`gh pr list --search '${KEYWORD}' --state open\`"
          fi
