name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  # Fork PRs get no secrets on `pull_request`; `pull_request_target` runs in the base
  # context. Checkout stays on the base ref, so untrusted PR code is never executed.
  pull_request_target:
    types: [opened]

jobs:
  # Anyone (including the owner) can summon the agent with /oc on an issue or PR.
  # It may also record a new rule into .github/review-learnings.md on request.
  mention:
    if: ${{ github.event.comment != null && (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OC_PROXY_CONFIG }}
        with:
          model: ${{ secrets.OC_MODEL }}
          use_github_token: true
          share: "false"

  # The OpenCode action requires the event actor to have repository write/admin access.
  # Check that exact identity before creating the action job's write-capable token.
  auto-issue-permission:
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.user.login != github.repository_owner && github.event.issue.user.type != 'Bot' }}
    name: Check issue actor permission
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check issue actor permission
        id: permission
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          response_file="${RUNNER_TEMP}/issue-actor-permission.json"
          error_file="${RUNNER_TEMP}/issue-actor-permission.error"
          set +e
          http_status="$(curl --silent --show-error --location \
            --retry 2 --retry-delay 1 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${REPOSITORY}/collaborators/${ACTOR}/permission" \
            2>"${error_file}")"
          curl_status=$?
          set -e

          permission=""
          if [[ "${curl_status}" -eq 0 && "${http_status}" == "200" ]]; then
            permission="$(jq -r '.permission // empty' "${response_file}" 2>/dev/null || true)"
          fi

          allowed=false
          if [[ "${curl_status}" -eq 0 && "${http_status}" == "200" && ("${permission}" == "admin" || "${permission}" == "write") ]]; then
            allowed=true
            echo "::notice::Issue actor ${ACTOR} has ${permission} permission; OpenCode is allowed."
          elif [[ "${curl_status}" -ne 0 ]]; then
            echo "::notice::Permission API request failed; treating ${ACTOR} as not allowed. OpenCode was not invoked."
          elif [[ "${http_status}" != "200" ]]; then
            echo "::notice::Permission API returned HTTP ${http_status}; treating ${ACTOR} as not allowed. OpenCode was not invoked."
          else
            echo "::notice::Issue actor ${ACTOR} has ${permission:-unknown} permission, not admin/write. OpenCode was not invoked."
          fi

          echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"

  # Auto-answer issues opened by real outside people with write/admin access.
  auto-issue:
    needs: auto-issue-permission
    if: ${{ needs.auto-issue-permission.result == 'success' && needs.auto-issue-permission.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OC_PROXY_CONFIG }}
        with:
          model: ${{ secrets.OC_MODEL }}
          use_github_token: true
          share: "false"
          prompt: "First read `.github/review-learnings.md` if it exists. Every rule in it is binding: never give feedback a rule forbids. Then: a person outside this project just opened this issue. Reply once, concisely and helpfully: acknowledge them, restate the core ask in one line, then either answer it or list the exact repro details still missing (version, OS, MCP client, minimal steps, logs). End with a clear next action. Never invent behavior you cannot verify from the issue text."

  # Auto-review pull requests opened by real outside people.
  auto-pr:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OC_PROXY_CONFIG }}
        with:
          model: ${{ secrets.OC_MODEL }}
          use_github_token: true
          share: "false"
          prompt: "First read `.github/review-learnings.md` if it exists. Every rule in it is binding: never raise a point a rule forbids, even if it looks like a reasonable nit. Then: an outside contributor just opened this pull request. Thank them, then review the diff and post one concise review: a 1-2 sentence summary of what the PR does; only real, high-confidence findings (bugs, security, correctness, perf regressions) each as path:line + problem + fix, or exactly 'No blocking issues found.'; and a verdict of APPROVE / REQUEST_CHANGES / COMMENT with a one-line reason. Skip style nitpicks. Never restate the diff."
