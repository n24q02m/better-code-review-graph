[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-code-review-graph"
version = "3.6.0"
description = "Knowledge graph for token-efficient code reviews — fixed search, configurable embeddings, qualified call resolution"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
requires-python = "==3.13.*"
authors = [{ name = "n24q02m" }]
keywords = ["code-review", "knowledge-graph", "tree-sitter", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.26.0,<2",
    "fastmcp>=2.14.5,<3",
    "tree-sitter>=0.25.2,<1",
    "tree-sitter-language-pack>=0.13.0,<1",
    "networkx>=3.6.1,<4",
    "watchdog>=4.0.2,<6",
    "qwen3-embed>=1.6.0",
    "cohere>=5.21.1",
    "google-genai>=1.68.0",
    "openai>=1.109.1",
    "httpx",
    "pydantic-settings",
    "mcp-relay-core>=1.4.0",
]

[project.scripts]
better-code-review-graph = "better_code_review_graph.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "pytest-timeout",
    "ruff>=0.15.8",
    "syrupy",
    "ty>=0.0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/better_code_review_graph"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "--tb=short -q -m 'not integration and not full and not e2e'"
markers = [
    "integration: integration tests (deselect with '-m not integration')",
    "full: full/real live MCP protocol tests (deselect with '-m not full')",
    "e2e: end-to-end MCP protocol tests via conftest_e2e (deselect with '-m not e2e')",
    "slow: slow tests (deselect with '-m not slow')",
]

[tool.coverage.run]
source = ["src/better_code_review_graph"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version", "server.json:version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
